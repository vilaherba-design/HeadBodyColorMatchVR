; Head Body Color Match 1.1.0 by mrtony - https://www.nexusmods.com/fallout4/mods/110802 - GPL-3.0
; Fallout 4 VR 1.2.72 port (VR port 1).
; Lines starting with ; are comments.
; With a reload key set (iReloadKey, off by default), edit while the game runs and press it: the change shows on the NPCs around you.

; 1 = on, 0 = off (the plugin writes nothing and restores the original colours on reload).
bEnabled=1

; Windows virtual-key code of the reload key: 121 = F10, 120 = F9, 0 = no key.
; VR: the key is read from the PC keyboard even when the game window is not focused.
iReloadKey=0

; Scales every factor below: 1 + (factor - 1) * fStrength. 1.0 = as measured, 0.0 = vanilla.
fStrength=1.0

; After a reload, rebuild the NPCs whose colour changed so it shows at once: 1 = yes, 0 = no.
iRefresh=1

; 1 = the player's body is corrected too, 0 = the player is left alone.
bIncludePlayer=1

; The correction, by the NPC's skin tone: L = 0.299 R + 0.587 G + 0.114 B of its skin tint (0 = black, 1 = white).
; ToneBand=<Lmin>,<Lmax>,<R>,<G>,<B> multiplies the body's tint of a woman whose L falls in the band.
; ToneBandMale is the same for men. The first matching band wins; outside every band the body stays vanilla.
; The player has bands of their own below.
ToneBand=0.00,0.18,1.35,1.60,1.55
ToneBand=0.18,0.24,1.140,1.141,1.137
ToneBand=0.24,0.35,1.015,1.135,1.220
ToneBand=0.35,0.50,1.000,1.043,1.000
ToneBand=0.50,0.59,0.994,1.000,1.029
ToneBand=0.59,0.62,0.983,1.010,1.063
ToneBand=0.62,0.76,0.989,0.981,1.025
ToneBand=0.76,0.80,0.978,0.978,0.972
ToneBand=0.80,0.90,0.977,0.979,1.011
ToneBand=0.90,1.00,0.984,0.983,1.000
ToneBandMale=0.00,0.18,1.230,1.310,1.325
ToneBandMale=0.18,0.24,1.057,1.194,1.266
ToneBandMale=0.24,0.35,1.054,1.130,1.149
