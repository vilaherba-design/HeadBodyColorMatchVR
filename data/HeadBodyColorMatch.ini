; One NPC by hand: Override.<form ID>=R,G,B beats the bands. The ID is the NPC's base or face ID
; (8 hex digits, as the console shows it for the base NPC); a placed reference ID never matches.
; The player is 00000007. OverrideRear.<form ID>=R,G,B sets the nape alone.
; Cinder (her face's dirt and bruises sit on the neck), measured and judged in game:
Override.000AE153=0.820,0.900,0.950
